# 应用名称
spring.application.name=url-shortener

# 服务端口（默认就是 8080，这里显式写出方便你记住）
server.port=8080

# ===== 数据源（MySQL）=====
# JDBC 连接串：协议 jdbc:mysql，主机 localhost，端口 3306，数据库 url_shortener
# 后面的参数是兼容性设置（关 SSL、指定时区、UTF-8 编码、允许获取公钥）
spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
# 驱动类（Spring Boot 能根据 url 自动识别，这里显式写出方便理解）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update：启动时自动根据实体创建/更新表结构（开发用；生产要改成 validate）
spring.jpa.hibernate.ddl-auto=update
# 控制台打印 Hibernate 生成的 SQL，方便学习它到底执行了什么
spring.jpa.show-sql=true
# 打印的 SQL 排版更清晰
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 方言（针对 MySQL 的 SQL 语法）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
